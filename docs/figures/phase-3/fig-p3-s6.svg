<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="fig-p3-s6-title fig-p3-s6-desc" font-family="JetBrains Mono, ui-monospace, monospace" fill="var(--m-ink, #1a1a1a)">
  <title id="fig-p3-s6-title">Sprint 6: a hosted revision is verified, rolled back once, then torn down</title>
  <desc id="fig-p3-s6-desc">States: deployed, verified, rolled-back and torn-down, which is terminal. Deployed becomes verified when the smoke test and role walkthroughs pass, or rolled-back when the smoke test fails. The rollback rehearsal moves verified to rolled-back, and the previous tag serving moves it back. azd down on the agreed date ends in torn-down.</desc>
  <rect x="0" y="0" width="640" height="380" fill="var(--m-panel, #f3f1e8)"/>
  <defs><marker id="fig-p3-s6-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker><marker id="fig-p3-s6-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">SPRINT 6 · VERIFY, REHEARSE, HAND OFF</text>
  <circle cx="26" cy="124" r="5" fill="var(--m-ink, #1a1a1a)"/>
  <rect x="40" y="100" width="140" height="48" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="110" y="122" font-size="12.5" text-anchor="middle" font-weight="700">deployed</text>
  <text x="110" y="136" font-size="11" text-anchor="middle" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">sha-N from Sprint 5</text>
  <rect x="250" y="100" width="150" height="48" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="325" y="122" font-size="12.5" text-anchor="middle" font-weight="700">verified</text>
  <text x="325" y="136" font-size="11" text-anchor="middle" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">smoke + walkthroughs</text>
  <rect x="480" y="100" width="140" height="48" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <rect x="483" y="103" width="134" height="42" fill="none" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="550" y="122" font-size="12.5" text-anchor="middle" font-weight="700">torn-down</text>
  <text x="550" y="136" font-size="11" text-anchor="middle" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">agreed date</text>
  <rect x="250" y="270" width="150" height="48" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="325" y="292" font-size="12.5" text-anchor="middle" font-weight="700">rolled-back</text>
  <text x="325" y="306" font-size="11" text-anchor="middle" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">redeploy sha-N-1</text>
  <line x1="31" y1="124" x2="39" y2="124" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-p3-s6-head-amber)"/>
  <line x1="180" y1="124" x2="249" y2="124" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-p3-s6-head-amber)"/>
  <rect class="m-knock" x="197.7" y="107.03" width="33.599999999999994" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="214.5" y="118" font-size="11.5" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">pass</text>
  <line x1="400" y1="124" x2="479" y2="124" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-p3-s6-head-amber)"/>
  <rect class="m-knock" x="408.9" y="107.03" width="61.199999999999996" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="439.5" y="118" font-size="11.5" text-anchor="middle" fill="var(--m-amber-ink, #85590c)">azd down</text>
  <line x1="110" y1="148" x2="249" y2="290" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-p3-s6-head-rose)"/>
  <rect class="m-knock" x="138.55" y="202.03" width="81.89999999999999" height="15.5" fill="var(--m-panel, #f3f1e8)"/>
  <text x="179.5" y="213" font-size="11.5" text-anchor="middle" fill="var(--m-rose-ink, #b0344d)">smoke fails</text>
  <line x1="300" y1="148" x2="300" y2="269" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-p3-s6-head-amber)"/>
  <text x="292" y="214" font-size="11.5" text-anchor="end" fill="var(--m-amber-ink, #85590c)">rehearsal</text>
  <line x1="385" y1="270" x2="385" y2="149" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-p3-s6-head-amber)"/>
  <text x="393" y="214" font-size="11.5" fill="var(--m-amber-ink, #85590c)">sha-N-1 serves</text>
  <text x="20" y="350" font-size="11" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">Evidence for each transition goes into docs/PHASE_3_HANDOFF.md, as Phase 2 did.</text>
  <text x="20" y="368" font-size="11" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">hosted smoke: compose-smoke.sh with STRIA_URL; the sample service and database must be unreachable.</text>
</svg>
