<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-labelledby="fig-p3-legend-title fig-p3-legend-desc" font-family="JetBrains Mono, ui-monospace, monospace" fill="var(--m-ink, #1a1a1a)">
  <title id="fig-p3-legend-title">Legend for the Phase 3 sprint figures</title>
  <desc id="fig-p3-legend-desc">Arrow styles: solid ink is a call, dashed ink a reply, solid teal a durable write, dashed amber a state change, dashed rose a failure. Borders: solid is a part that exists, dashed is planned or optional, double is a terminal state.</desc>
  <rect x="0" y="0" width="640" height="300" fill="var(--m-panel, #f3f1e8)"/>
  <defs><marker id="fig-p3-legend-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-p3-legend-head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-teal-ink, #18696a)"/></marker><marker id="fig-p3-legend-head-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-amber-ink, #85590c)"/></marker><marker id="fig-p3-legend-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <text x="20" y="22" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">FIGURE 0.1 · HOW TO READ THE SPRINT FIGURES</text>
  <line x1="40" y1="56" x2="179" y2="56" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" marker-end="url(#fig-p3-legend-head-ink)"/>
  <text x="200" y="60" font-size="11" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">call or request</text>
  <line x1="40" y1="86" x2="179" y2="86" stroke="var(--m-ink, #1a1a1a)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-p3-legend-head-ink)"/>
  <text x="200" y="90" font-size="11" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">reply</text>
  <line x1="40" y1="116" x2="179" y2="116" stroke="var(--m-teal-ink, #18696a)" stroke-width="1.2" marker-end="url(#fig-p3-legend-head-teal)"/>
  <text x="200" y="120" font-size="11" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">durable write (database, Blob, Key Vault, registry)</text>
  <line x1="40" y1="146" x2="179" y2="146" stroke="var(--m-amber-ink, #85590c)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-p3-legend-head-amber)"/>
  <text x="200" y="150" font-size="11" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">state change</text>
  <line x1="40" y1="176" x2="179" y2="176" stroke="var(--m-rose-ink, #b0344d)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#fig-p3-legend-head-rose)"/>
  <text x="200" y="180" font-size="11" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">failure: the run stops here</text>
  <text x="20" y="218" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">BORDERS</text>
  <rect x="20" y="232" width="180" height="44" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="110" y="252" font-size="12.5" text-anchor="middle" font-weight="700">solid</text>
  <text x="110" y="266" font-size="11" text-anchor="middle" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">exists or runs now</text>
  <rect x="230" y="232" width="180" height="44" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)" stroke-dasharray="5 4"/>
  <text x="320" y="252" font-size="12.5" text-anchor="middle" font-weight="700">dashed</text>
  <text x="320" y="266" font-size="11" text-anchor="middle" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">planned or optional</text>
  <rect x="440" y="232" width="180" height="44" fill="var(--m-amber-fill, #f5ecd9)" stroke="var(--m-amber-ink, #85590c)"/>
  <rect x="443" y="235" width="174" height="38" fill="none" stroke="var(--m-amber-ink, #85590c)"/>
  <text x="530" y="252" font-size="12.5" text-anchor="middle" font-weight="700">double</text>
  <text x="530" y="266" font-size="11" text-anchor="middle" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">terminal state</text>
</svg>
