  <text x="20" y="456" font-size="11" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">Also in Sprint 0: PR #22 merged after 8 of 8 checks; baseline 119 tests, 0 warnings.</text>
  <text x="20" y="474" font-size="11" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">Verified twice: a forced restart passes after about 1.5 s; a dead port exits 1 after the timeout.</text>
