<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" role="img" aria-labelledby="fig-p3-s0-title fig-p3-s0-desc" font-family="JetBrains Mono, ui-monospace, monospace" fill="var(--m-ink, #1a1a1a)">
  <title id="fig-p3-s0-title">Sprint 0: compose-smoke.sh waits for /readyz before checking</title>
  <desc id="fig-p3-s0-desc">Lifelines: docker compose, compose-smoke.sh, stria-server and the PostgreSQL db. 1 compose starts stria-server and returns before Kestrel listens. 2 a GET /readyz gets 000. 3 the script polls /readyz every second up to STRIA_READY_TIMEOUT. 4 stria-server calls CanConnectAsync on db. 5 db answers. 6 stria-server replies 200. 7 the script runs 16 checks. 8 all checks pass.</desc>
  <rect x="0" y="0" width="640" height="490" fill="var(--m-panel, #f3f1e8)"/>
  <defs><marker id="fig-p3-s0-head-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-ink, #1a1a1a)"/></marker><marker id="fig-p3-s0-head-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="var(--m-rose-ink, #b0344d)"/></marker></defs>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">SPRINT 0 · CLOSE OUT PREP · TICKET 0.3</text>
