<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" role="img" aria-labelledby="fig-p3-s1-title fig-p3-s1-desc" font-family="JetBrains Mono, ui-monospace, monospace" fill="var(--m-ink, #1a1a1a)">
  <title id="fig-p3-s1-title">Sprint 1: each Azure behaviour is a setting; Compose leaves them unset</title>
  <desc id="fig-p3-s1-desc">Five rows compare Compose, with the setting unset, and Azure, with it set: ForwardedHeaders:Enabled, the DataProtection Blob and Key Vault URIs, Database:UseEntraAuth, APPLICATIONINSIGHTS_CONNECTION_STRING, and the AzureRuntimeSettings startup check, which refuses a partial set.</desc>
  <rect x="0" y="0" width="640" height="520" fill="var(--m-panel, #f3f1e8)"/>
  <text x="20" y="18" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">SPRINT 1 · CLOUD-READY CODE · TICKETS 1.1 TO 1.5</text>
  <text x="20" y="48" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">COMPOSE · SETTING UNSET</text>
  <text x="330" y="48" font-size="11" letter-spacing="1.2" fill="var(--m-ink-mute, #6f6f6a)">AZURE · SETTING SET</text>
  <text x="20" y="80" font-size="11.5" fill="var(--m-violet-ink, #5b4fa3)">ForwardedHeaders:Enabled</text>
  <rect x="20" y="90" width="290" height="44" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="165" y="110" font-size="12.5" text-anchor="middle" font-weight="700">X-Forwarded-* ignored</text>
  <text x="165" y="124" font-size="11" text-anchor="middle" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">nothing proxies; redirect_uri http://</text>
  <rect x="330" y="90" width="290" height="44" fill="var(--m-blue-fill, #e6edf6)" stroke="var(--m-blue-ink, #2f5d9a)"/>
  <text x="475" y="110" font-size="12.5" text-anchor="middle" font-weight="700">trust ingress X-Forwarded-*</text>
  <text x="475" y="124" font-size="11" text-anchor="middle" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">UseForwardedHeaders first; https://</text>
  <text x="20" y="158" font-size="11.5" fill="var(--m-violet-ink, #5b4fa3)">DataProtection:BlobUri + DataProtection:KeyVaultKeyUri</text>
  <rect x="20" y="168" width="290" height="44" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="165" y="188" font-size="12.5" text-anchor="middle" font-weight="700">stria-dpkeys volume</text>
  <text x="165" y="202" font-size="11" text-anchor="middle" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">/var/lib/stria/dpkeys</text>
  <rect x="330" y="168" width="290" height="44" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="475" y="188" font-size="12.5" text-anchor="middle" font-weight="700">Blob keys.xml + Key Vault key</text>
  <text x="475" y="202" font-size="11" text-anchor="middle" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">one key ring for every replica</text>
  <text x="20" y="236" font-size="11.5" fill="var(--m-violet-ink, #5b4fa3)">Database:UseEntraAuth</text>
  <rect x="20" y="246" width="290" height="44" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="165" y="266" font-size="12.5" text-anchor="middle" font-weight="700">password in connection string</text>
  <text x="165" y="280" font-size="11" text-anchor="middle" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">STRIA_DB_PASSWORD from .env</text>
  <rect x="330" y="246" width="290" height="44" fill="var(--m-teal-fill, #e1efee)" stroke="var(--m-teal-ink, #18696a)"/>
  <text x="475" y="266" font-size="12.5" text-anchor="middle" font-weight="700">Entra token as the password</text>
  <text x="475" y="280" font-size="11" text-anchor="middle" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">UsePeriodicPasswordProvider, 55 min</text>
  <text x="20" y="314" font-size="11.5" fill="var(--m-violet-ink, #5b4fa3)">APPLICATIONINSIGHTS_CONNECTION_STRING</text>
  <rect x="20" y="324" width="290" height="44" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="165" y="344" font-size="12.5" text-anchor="middle" font-weight="700">no exporter registered</text>
  <text x="165" y="358" font-size="11" text-anchor="middle" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">StartActivity returns null</text>
  <rect x="330" y="324" width="290" height="44" fill="var(--m-indigo-fill, #e9e9f6)" stroke="var(--m-indigo-ink, #4b4f9e)"/>
  <text x="475" y="344" font-size="12.5" text-anchor="middle" font-weight="700">UseAzureMonitor()</text>
  <text x="475" y="358" font-size="11" text-anchor="middle" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">Stria and Npgsql spans to App Insights</text>
  <text x="20" y="392" font-size="11.5" fill="var(--m-violet-ink, #5b4fa3)">startup check: AzureRuntimeSettings.Missing()</text>
  <rect x="20" y="402" width="290" height="44" fill="var(--m-green-fill, #e5f0e4)" stroke="var(--m-green-ink, #336b40)"/>
  <text x="165" y="422" font-size="12.5" text-anchor="middle" font-weight="700">none set: starts</text>
  <text x="165" y="436" font-size="11" text-anchor="middle" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">Compose and tests unchanged</text>
  <rect x="330" y="402" width="290" height="44" fill="var(--m-rose-fill, #f7e4e7)" stroke="var(--m-rose-ink, #b0344d)" stroke-dasharray="5 4"/>
  <text x="475" y="422" font-size="12.5" text-anchor="middle" font-weight="700">partial set: refuses to start</text>
  <text x="475" y="436" font-size="11" text-anchor="middle" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">error names keys, never values</text>
  <text x="20" y="478" font-size="11" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">Forwarded headers alone are allowed, since any reverse proxy may need them. App Insights is optional.</text>
  <text x="20" y="496" font-size="11" class="m-serif" font-family="'Source Serif 4', Georgia, serif" fill="var(--m-ink-soft, #4a4a4a)">Result: 139 tests pass (20 new); the Compose stack passes compose-smoke.sh unchanged.</text>
</svg>
