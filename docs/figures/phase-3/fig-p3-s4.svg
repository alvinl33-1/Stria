<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 450" role="img" aria-labelledby="fig-p3-s4-title fig-p3-s4-desc" font-family="JetBrains Mono, ui-monospace, monospace" fill="var(--m-ink, #1a1a1a)">
  <title id="fig-p3-s4-title">Sprint 4: provisioning and the one-time setup, after authorization</title>
  <desc id="fig-p3-s4-desc">Lifelines: Alvin, azd with Bicep, the Azure resource group and Entra ID. 1 Alvin runs azd provision after written approval. 2 azd creates the resources and budget. 3 Azure returns outputs. 4 Alvin sets the PostgreSQL Entra admin. 5 creates the identity principal with minimal grants. 6 stores secrets in Key Vault. 7 adds the hosted redirect URIs in Entra ID.</desc>
