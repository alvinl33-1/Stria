<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 410" role="img" aria-labelledby="fig-p3-s3-title fig-p3-s3-desc" font-family="JetBrains Mono, ui-monospace, monospace" fill="var(--m-ink, #1a1a1a)">
  <title id="fig-p3-s3-title">Sprint 3: infra/main.bicep describes every resource in rg-stria-demo</title>
  <desc id="fig-p3-s3-desc">The resource group rg-stria-demo, from infra/main.bicep and azure.yaml, owns three groups. Shared: managed identity, ACR Basic, Key Vault and the storage account. Data and operations: PostgreSQL Flexible Server, Log Analytics, App Insights and a budget alert. Container Apps environment: stria-server, sample-payment-gateway and the migration job. All are dashed because none exists yet.</desc>
