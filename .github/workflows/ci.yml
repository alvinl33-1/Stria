name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      STRIA_REQUIRE_DOCKER_TESTS: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Stria.sln

      - name: Build
        run: dotnet build Stria.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Stria.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx"
