version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/Stria.API"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # Stay on the .NET 10 LTS line. A major image bump without retargeting the projects breaks
    # the containers (the runtime image would lack .NET 10); upgrade majors deliberately instead.
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/Stria.SampleService"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # Stay on the .NET 10 LTS line. A major image bump without retargeting the projects breaks
    # the containers (the runtime image would lack .NET 10); upgrade majors deliberately instead.
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
