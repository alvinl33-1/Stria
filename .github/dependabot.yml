version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dotnet-minor-patch:
        applies-to: "version-updates"
        update-types:
          - "minor"
          - "patch"
    # These families ship one major per .NET release and must move together with the target
    # framework (lecture 8b). A lone major bump splits a family, so upgrade them deliberately in one
    # PR when we retarget. Other packages keep their majors; the dependency-audit gate still runs.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/Stria.API"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # Stay on the .NET 10 LTS line. A major image bump without retargeting the projects breaks
    # the containers (the runtime image would lack .NET 10); upgrade majors deliberately instead.
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/Stria.SampleService"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    # Stay on the .NET 10 LTS line. A major image bump without retargeting the projects breaks
    # the containers (the runtime image would lack .NET 10); upgrade majors deliberately instead.
    ignore:
      - dependency-name: "dotnet/*"
        update-types: ["version-update:semver-major"]
