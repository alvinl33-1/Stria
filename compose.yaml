services:
  stria-server:
    container_name: stria-server
    build:
      context: .
      dockerfile: Stria.API/Dockerfile
    ports:
      # Stria.API listens on plain HTTP port 8080 in its container. Bind it to loopback
      # so the local dashboard and API are reachable without exposing them to the LAN.
      - "127.0.0.1:8080:8080"
    environment:
      ConnectionStrings__Stria: "Host=db;Port=5432;Database=stria;Username=stria;Password=${STRIA_DB_PASSWORD:?set STRIA_DB_PASSWORD}"
      Database__MigrateOnStartup: "true"   # local/Compose convenience; leave off elsewhere
      Retention__MaxAgeDays: "90"
      Retention__MaxClearedExperiments: "10000"
      DataProtection__KeysPath: "/var/lib/stria/dpkeys"
      # Entra test tenant. Values come from .env (gitignored); Compose runs as Production, so
      # the host refuses to start without them.
      AzureAd__TenantId: "${STRIA_TENANT_ID:?set STRIA_TENANT_ID}"
      AzureAd__ClientId: "${STRIA_CLIENT_ID:?set STRIA_CLIENT_ID}"
      AzureAd__ClientSecret: "${STRIA_CLIENT_SECRET:?set STRIA_CLIENT_SECRET}"
      AzureAdApi__TenantId: "${STRIA_TENANT_ID}"
      AzureAdApi__ClientId: "${STRIA_CLIENT_ID}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - stria-dpkeys:/var/lib/stria/dpkeys

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: stria
      POSTGRES_USER: stria
      POSTGRES_PASSWORD: ${STRIA_DB_PASSWORD:?set STRIA_DB_PASSWORD}
    volumes:
      - stria-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stria -d stria" ]
      interval: 5s
      timeout: 3s
      retries: 10
    # No "ports:" on purpose: the database is reachable only from other Compose services.

  sample-payment-gateway:
    build:
      context: .
      dockerfile: Stria.SampleService/Dockerfile
    environment:
      Stria__BaseUrl: "http://stria-server:8080"
      Stria__ServiceName: "PaymentGateway"
      Stria__PollIntervalMs: "1000"
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - stria-server
    restart: unless-stopped

volumes:
  stria-pgdata:
  stria-dpkeys:
