# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json
# azd provisions infra/ only. CI builds, scans and deploys the sha- tagged images (Sprints 2 and 5),
# so there is no services: section and `azd deploy` has nothing to do.
name: stria
infra:
  provider: bicep
  path: infra
  module: main
# The deploy path owns the images: before every provision, the hook sets STRIA_IMAGE_TAG to the
# tag the demo runs, so provisioning repeats it (ticket 5.3). azd runs shell: sh hooks with bash.
hooks:
  preprovision:
    shell: sh
    run: scripts/preprovision.sh
